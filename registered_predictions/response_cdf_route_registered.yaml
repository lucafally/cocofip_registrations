    evidence: scripts/results/cdf_response_audit_v1/validation/validation_fm_density_ladder_q3.json
  - id: Q4
    registered: "2026-09-30 (16:45, before any corrected fold existed: jobs 12043400-12043405 ran without --with-recalibration and produced raw folds only; resubmitted as 12043481-12043486)"
    status: graded 2026-09-30 — falsified (all three methods, by the registered bands)
    claim: >
      After the review fixes (MonotoneCDFCorrection.conditional_cdf renormalized over the fit
      support; create_response(mode="cdf") evaluating edges beyond the kinematic support at its
      end instead of setting F = 1), a recalibration wrapper gives the same corrected fold through
      both routes. On the real-MC checkpoint rw4 ctxC w512 d2e9 s0 (raw final tier), for each of
      recalibration.method monotone_cdf, latent_mle and moments, the corrected fold
      (metrics fold_corrected / corr_fold_arrays.npz) with response: cdf (RK4 256) and with
      response: density (sub-grid 11, dopri5 1e-7), both on the same 512 Gauss-Legendre nodes
      (32 per panel), ROI-normalized, differ in no ROI bin by more than 0.3 Poisson band units at
      1e9 (the bar of Q2), and for latent_mle and moments by no more than 0.1.
    falsified_if: >
      the gap exceeds 0.3 band units for any method, or 0.1 for latent_mle or moments.
    basis: >
      R41 (raw model: sub-grid >= 11 brings the density route within 0.02-0.03 band units of the CDF
      route); unit tests of the three wrappers (CDF = integral of the density, 2e-5 absolute). The
      monotone wrapper interpolates M and M' separately on 257 u-points, which by itself can cost
      1e-5 to 1e-4 per bin — hence the wider band for it.
    not_predicted: >
      the size of the pre-fix error: the same cdf runs with the unfixed code (jobs 12043408
      monotone_cdf, 12043409 moments; resubmitted as 12043487, 12043488) are measured and reported, no band.
    where: scripts/data_pipeline.py --eval-model from the isolated code copy /ptmp/lfall/cdf_route_wt (fixed) and /ptmp/lfall/cdf_route_base (unfixed); configs cdfrecal_<method>_<route>.yaml
    outcome: >
      jobs 12043481-12043486 (fixed code; 12043773 repeats moments cdf on the landed code), 12043487,
      12043488 (unfixed code). Corrected fold, CDF vs density (sub-grid 11), max over ROI bins in band
      units at 1e9: monotone_cdf 1.87 (band 0.3: FAILS; median 0.17; window medians apart by 2.6 % bulk,
      4.4 % edge, 15 % endpoint), latent_mle 0.119 and moments 0.115 (band 0.1: FAIL). The raw folds of
