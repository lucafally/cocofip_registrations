# Predictions of the CDF-route response lane (docs/response_cdf_route.md).
# Graded predictions are recorded in the lane's Log; none is open.
lane: response_cdf_route.md
metric: fold low-edge / bulk median |flow/truth - 1| ([21, 23.5) keV and [23.5, 38.6] keV, the S14 bundle windows)
predictions:
  - id: Q1
    registered: 2026-09-28
    status: graded 2026-09-29 — falsified
    claim: >
      Re-folding one production real-MC checkpoint
      (scripts/results/20260917_174429_rscale_ctxC_w512_d2e9_s0_lr4p0536em05_rw4, raw final weights)
      with the CDF route (float64 bin masses, fixed-grid RK4 with N_s from the doubling test) on a
      composite Gauss-Legendre E_start grid (16 x 32 on [qU, E0], panel boundaries at qU and E0)
      against running_histogram_1e11.h5 lowers the low-edge median |rel| by >= 2x relative to the
      lane's midpoint-2400 / sub-grid-7 headline fold of the same checkpoint (fold_quality F9/F10
      level 1.6-2.3e-3), while the bulk median moves by < 10 %.
    bands:
      low_edge_ratio_cdf_gl_over_midpoint: "<= 0.5"
      bulk_ratio_cdf_gl_over_midpoint: "[0.9, 1.1]"
    falsified_if: >
      the low-edge median moves by < 20 % (ratio in [0.8, 1.2]): the real-MC low-edge residual is
      then a model property as the fold_quality lane states, not the qU-step aliasing seen on the toy
      (response_cdf_route R6/R7/R14).
    basis: >
      response_cdf_route R6, R7, R14 (toy: the whole midpoint error is the qU step, GL removes it)
    where: a real-MC loader for scripts/audit_cdf_response.py (mirror scripts/profile_fold.py::load_run), one apu job
    outcome: >
      job 12023591 + scripts/audit_cdf_response_realmc_grade.py, pipeline window metric
      (window_residual_metrics, renormalize=True), stored fold (n_estart 4800, sub-grid 7, dopri5 1e-7)
      vs CDF + GL 16 x 32: low-edge median 1.245e-3 -> 1.131e-3 (ratio 0.908, inside the falsification
      band [0.8, 1.2]); bulk 4.350e-4 -> 4.360e-4 (ratio 1.002, inside [0.9, 1.1]). The quadrature error of
      the stored fold sits in the threshold bin at 21.04 keV alone (+2.83e-3, 96 sigma of the truth
      histogram); chi2/dof of the edge window 4562 -> 1756, of the ROI 864 -> 392. Over 254 stored folds
      at n_estart 4800 the re-weighted / stored edge median is 0.90 [0.63, 1.46] (job 12023793).
      Baseline: the stored fold of the checkpoint is at n_estart 4800, not the 2400 named in the claim;
      against the CDF fold on the midpoint-2400 grid (edge 1.273e-3) the low-edge ratio is 0.89. On the
      ROI-normalized variant of the metric the ratios are 1.137 (low edge) and 0.860 (bulk, outside its
      band). Falsified on every reading. Lane claims R33, R34, R37.
    evidence: scripts/results/cdf_response_audit_v1/realmc/rw4_ctxC_w512_d2e9_s0.json (Q1_grade_pipeline_metric), realmc/reweight_scan.json
  - id: Q2
    registered: 2026-09-30
    status: graded 2026-09-30 — falsified (criteria a and c)
    claim: >
      Acceptance of `inference.fold_accurate.response: cdf` as the default fold route, with the
      library implementation (InferenceInterface.create_response(mode="cdf"),
      FM / DNF.conditional_cdf, utils.quadrature.integration_rule), on six real-MC FM checkpoints
      of the scaling lane (both arms, widths 128-1024, D 1e8-3e9, raw final tier) and one real-MC
      Bernstein DNF trained for the purpose. Every criterion holds on every checkpoint:
      (a) inside the ROI the two routes agree on the same nodes and weights (the stored density
      response vs the CDF response, uniform grid with cut cells): each window median of the
      pipeline metric (edge, bulk, endpoint, ROI) differs by < 1 % and no ROI bin by more than
      0.3 Poisson band units at 1e9;
      (b) no bin mass is negative;
      (c) the mass of the lowest E_dep bin, ROI-normalized, is within 5 % of the truth histogram's
      (density route: -18 %), and the in-ROI fraction of the fold within 1e-3 of the truth's;
      (d) the proposed default numerics are converged: Gauss-Legendre 512 -> 1024 nodes and, for
      FM, RK4 256 -> 512 steps each move no ROI bin by more than 0.1 band units at 1e9;
      (e) the CDF fold on Gauss-Legendre 512 costs at most 1/10 of the stored density fold's
      response wall time (FM checkpoints).
    falsified_if: >
      any criterion fails on any checkpoint. Then the default stays `density` (with cut cells) and
      the failing checkpoint is recorded in the lane.
    basis: response_cdf_route R31-R35 (one checkpoint, audit-script implementation)
    where: scripts/validate_cdf_fold.py, one apu job; scripts/results/cdf_response_audit_v1/validation/
    outcome: >
      jobs 12039428 (six FM checkpoints) and 12039999 (DNF, EMA tier). (b) no negative mass on 7 of 7.
      (c) lowest bin: density -17.8 to -22.5 %, CDF -1.2 to +0.3 %; in-ROI fraction minus truth: CDF
      -0.3 to -4.9e-4 on the FM checkpoints, -2.9e-3 on the one-epoch DNF (its own model error): FAILS
      on the DNF. (d) node doubling 0.010-0.064, step doubling 0.0003-0.015 band units: holds. (e) 5-24 s
      against 574-999 s: holds. (a) 0.018 / 0.076 / 0.077 / 0.142 / 0.296 / 0.373 band units at 1e9 and
      window-median differences of 0.06-4.4 %: FAILS on ctxC w512 d2e9 (endpoint 1.2 %), base w512 d2e9
      (edge 4.4 %), base w256 d3e9 (0.373 band units) and the DNF (endpoint 4.5 %). By the rule above
      the default stays `density`. Post hoc (not part of the grade): the gap of (a) closes when the
      density route's sub-grid goes from 7 to 11 or more and does not move with the solver tolerance
      (jobs 12039748, 12039988; registered for the other four checkpoints as Q3). Lane claims R39-R41.
    evidence: scripts/results/cdf_response_audit_v1/validation/{validation_fm,validation_dnf,validation_fm_density_tols,validation_fm_density_ladder}.json
