      above the kinematic edge). Lane claims R42, R44, R46.
    evidence: scripts/results/cdf_response_audit_v1/review_fixes/{grade_unfixed.json, grades.json (q4), grade_extra.json, grade_q6_double_ratio.json, runs.tar.gz}
