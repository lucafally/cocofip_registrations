  - id: Q6
    registered: 2026-09-30 (17:02, after Q4 was seen to fail on monotone_cdf and before the runs below)
    status: graded 2026-09-30 — undecided (between the confirmation and the falsification band)
    claim: >
      The 1.87 band-unit gap between the two routes under recalibration.method monotone_cdf (Q4) is
      the density route's own numerics: MonotoneCDFCorrection.estimate_density reads u = F_raw from a
      513-point trapezoid table of the raw density over [e_lo, e_hi] (n_grid_cdf; 0.04-0.08 keV
      spacing against a peak of sigma 0.13 keV), linearly interpolated, where the CDF route takes
      F_raw from the flow. On the same checkpoint and 128 Gauss-Legendre nodes (4 x 32), the gap of
      the corrected density fold (sub-grid 11) to the corrected CDF fold falls by at least 4x when
      n_grid_cdf goes from 513 to 4097.
    falsified_if: >
      it falls by less than 2x: the gap is then not the table, and the wrapper's two surfaces
      disagree for another reason (the next suspects: M and M' interpolated separately on 257
      u-points; a defect in conditional_cdf that the unit test does not reach).
    basis: >
      linear interpolation of F across the peak is off by h^2/8 p' ~ 7e-3 at 513 points; with M'
      varying by 8 % over u (mder_swing 1.08) that is 1e-4 to 1e-3 per bin, the size of the gap
      (1.87 band units at 1e9 = 4e-4 in a bulk bin). Unit test with an analytic flow: CDF = integral
      of the density to 2e-5 at n_grid_cdf 2049.
    where: data_pipeline.py --eval-model --with-recalibration, configs cdfrecal128_monotone_{cdf,density513,density4097}.yaml, isolated code copy
    outcome: >
      jobs 12043804 (cdf), 12043805 (n_grid_cdf 513), 12043806 (4097). Corrected density fold vs
      corrected CDF fold on the 128 Gauss-Legendre nodes, max over ROI bins at 1e9: 2.02 -> 0.79 band
      units (x2.6): more than the 2x below which the claim falls, less than the 4x it predicts. The
      registration overlooked that the raw routes are themselves 0.82 apart on these 128 nodes
      (sub-grid 11), so 0.79 is at the floor of the comparison. Post hoc, with the raw gap divided out
      bin by bin: 2.12 -> 0.58 (x3.7). The table is the larger part of the monotone_cdf gap; 0.58 band
      units remain unexplained. Lane claim R45.
    evidence: scripts/results/cdf_response_audit_v1/review_fixes/{grade_extra.json (q6_*), grade_q6_double_ratio.json, runs.tar.gz}
