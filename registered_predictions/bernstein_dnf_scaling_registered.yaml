# Registered predictions of the Bernstein-DNF scale-up study (docs/bernstein_dnf_scaling_plan.md §1).
# Written 2026-09-17 before any BD job was submitted. Graded entries move to the lane doc's Log.
lane: bernstein_dnf_scaling.md   # created with W1's first numbers
metric_primary: fold.windows.bulk.median_abs_rel   # uniform fold n_estart 2400, psg 7, tier per B6
metrics_secondary: [fold.windows.edge.median_abs_rel, fold.median_abs_rel_roi, grid.kl_b500_mean, nll.nll_mean]
# 2026-09-18 (user request): density-level comparisons also read the CDF-space pair that the
# battery already computes at no extra cost — W1 = sum |dF| w (L1 of the CDF difference) and
# CvM = sum dF^2 w (squared L2), i.e. grid.w1_b500_mean / grid.cvm_b500_mean, with the
# noise-subtracted grid.cvm_excess_b500_mean as the one with a floor at 0. KL is peak-weighted
# and KS is a sup, so neither sees a broad displacement of mass; W1/CvM do.
metrics_density: [grid.kl_b500_mean, grid.w1_b500_mean, grid.cvm_excess_b500_mean, grid.ks_b500_mean]
reference_cell: "bd_ref_d32_k12_h64_b2_n1e8 (879k steps at batch 1024, lr 5e-4, SiLU hypernet)"
fm_comparators:
  uncoupled_ctxC_n1e8: {runs: "*_qtr_none_n1e8_s*", fold_roi_median: 2.98e-4, fold_roi_range: [2.4e-4, 8.1e-4], seeds: 7, note: bimodal}
  coupled_e18_n1e8: {runs: "*_qtr_qotlsid_e18*_n1e8_s*", fold_roi_median: 1.78e-4, seeds: 8}
