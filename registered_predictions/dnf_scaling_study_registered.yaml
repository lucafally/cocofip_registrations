# Registered predictions of the Bernstein-DNF capacity x unique-samples scaling study
# (docs/paper_dnf_scaling_study.md §8). Written 2026-09-23 before any dss* job ran; the
# commit that adds this file is the registration. Graded entries move to the lane doc's Log
# (docs/dnf_scaling_study.md) and get a `status:` line here.
lane: dnf_scaling_study.md
plan: paper_dnf_scaling_study.md
metric_primary: grid_final_raw.kl_b500_mean      # bias-corrected KL b500, raw final tier, floor 0 (plan §5)
metrics_secondary: [grid.kl_b500_mean, grid.kl_b1000_mean, grid.kl_b100_mean, grid.cvm_excess_b500_mean,
                    grid.w1_b500_mean, grid.ks_b500_mean, nll.nll_mean]
reported_not_fitted: [fold.windows.bulk.median_abs_rel, fold.windows.edge.median_abs_rel]
capacity_axis: "N_eff = k (M + 1), scaling.n_eff (plan §2; BD lane D37)"
data_axis: "unique rows D = scaling.d_unique_samples = 0.9 n, nested per-replica subsets (plan §3)"
budget: "3e6 steps at batch 1024 (plan §4); 879k as the BD-linked slice; 1e7 in the pilot only"
arms: {S: h64_b2, L: h256_b4, XL: h512_b4, XXL_probe: h1024_b4}
ladder_M: [8, 16, 32, 64, 128, 256, 512]
ladder_n: [1e6, 3e6, 1e7, 3e7, 1e8]
replicas: "r = 0, 1, 2 -> model seed r, data.sample_seed 1000 + r; 5 at the corners and centre of arm L"
recipe_frozen: "lr 5e-4 (unless the 0e scan moves it), batch 1024, wd 1e-6, SiLU, tail_bound 5, bernstein_impl fast, cuda_graph, batch_gather, WarmupAnnealingCooldown, EMA 0.9999 secondary, checkpoint_interval_s 600, metric_bins [1000, 500, 100]"
inherited_priors:
  kl_seed_spread: "1.06-1.44x, cell-dependent (BD D23, D34)"
  n_eff_spearman: "-0.91 over 16 cells at 879k (D37)"
  indicative_fit_h64_b2_879k: "KL = 9.4e-5 + 0.50 N_eff^-1.27 (E free); N_eff^-0.79 (E = 0)"
  steps_exponent: "KL ~ steps^-0.135 at N_eff 1548 (D34)"
  data_gain_1e7_to_1e8_at_M128: "0.87x, flat across 1x-4x budgets (D32, D35)"
  fm_real_mc_comparator: "beta_D(KL, pooled D >= 1e7, E = 0) = 0.077 [0.047, 0.138] at 3e6 steps; alpha 0.30 [0.23, 0.63] in n_params (RW C6)"
