# Registered predictions of the resynthesis + Reflow study (docs/resynthesis_reflow_plan.md; lane
# docs/resynthesis_reflow.md; studies C and D of docs/qot_strengthening_plan.md).
# The git timestamp of this file and the registration stamp job (scripts/results/resyn_reflow/
# registration/stamp.json; shell_scripts/submit_resyn_reflow.py --stage stamp) are the registration.
# The stamp also records the sha256 of the coupler audit JSONs: the per-coupler raw / finiteB
# ratios of P-C1 / P-C2 are MEASURED INPUTS (from the coupler alone, before any flow of the study
# is trained), stamped with the yaml (the study-B pattern of the sbibm plan).
# Status of a prediction: draft | registered (stamp A 2026-10-15, job 31188715: claims, bands and kill criteria
# frozen; the P-C1 / P-C2 predicted ratios are added by stamp B, the audit JSONs, before any coupled flow is
# trained) | graded (verdict in the lane's Log; the `verdict:` line here is a pointer, the Log is the record).
# Phase 1 (1D) graded 2026-10-15; P-C2D graded 2026-10-16. Every prediction is graded.
lane: resynthesis_reflow.md
plan: resynthesis_reflow_plan.md
config: configs/resyn_reflow/study_v1.yaml
scope: >
  Toys T0 gauss_linear and T3 bimodal_cross; the production FM recipe of docs/qot_coupling_toy.md
  (FMResUNet of configs/examples/gaussian_toy_pipeline.yaml, n1e8 rows x 3 epochs at batch 1024,
  uniform time sampling, EMA 0.9999 for evaluation, accurate fold), re-run on raven (A100); arms
  none (independent), reassign (= cpl_qotwwide / cpl_qotwwide_t3: the production coupler recipe
  pretrained on raven, rank coupling), resynth (the SAME checkpoint, coupling_mode resynthesis:
  x0 = Phi^-1(F_hat(x1 | c))), reflow1 (1-Reflow of the independent run with the same seed: 1e8
  pairs at dopri5 1e-5, identical architecture and budget); 8 seeds per arm and toy, one coupler
  per toy. Converged battery = the run's own metrics.json (grid.w1_mean, grid.kl_quad_mean,
  grid.ks_mean vs the analytic truth at dopri5 1e-7; fold.norm_window.median_abs_rel_window of the
  accurate fold); few-NFE = scripts/audit_nfe_quality.py (euler / midpoint 2..32, dopri5 ladder);
  straightness = scripts/audit_path_straightness.py. Statistics: medians over seeds with 16-84 %
  seed percentiles; Mann-Whitney one-sided vs the reference arm, uncorrected, stated; seed
  bootstrap for ratios of medians. Optional 2D cell: gauss-nd-rot D = 2 through
  scripts/kr_qot_nd_demo.py at the R12 / S12 budget (4e7 x 12 ep, batch 1024, n_eval 16384),
  arms cpl_none, kr_qot (nested sort), kr_qot_resynth (stage-wise probit preimage), 10 seeds.
framing: >
  Resynthesis (study C): by formalism T1 / T2 (docs/coupler_audit_formalism.md) the converged
  resynthesis flow reproduces the coupler's OWN conditional law (F_gen = F_hat), the converged
  reassignment flow the batch-smoothed, marginally recalibrated coupler at B = 1024. The metric-
  matched audit evaluates the flow battery on both densities for the study's coupler (variants
  `raw` and `finiteB`), so the predicted resynthesis / reassignment ratio per metric is
  raw / finiteB OF THIS COUPLER. The published tab:density numbers (docs/qot_calibration_audit.md
  A15, 17 couplers, geometric means of raw-prediction / FM: W1 7.5x T0 / 2.5x T3, KL 470x / 26x,
  fold 43x / 3.8x; finiteB-prediction / FM 0.87-1.09 on W1) are the reference scale, not the band.
  Reflow (study D): the teacher is the independent-coupling flow (the paper's `none` arm, EMA
  tier), the student the identical architecture and budget on 1e8 teacher pairs; the comparison
  arm is AQCOT (reassign). Bands are the review plan's (docs/qot_strengthening_plan.md C / D).
reference_values:   # from the lanes, for scale; not graded here
  tab_density_raw_over_fm: {T0: {w1: 7.5, kl: 470, fold: 43}, T3: {w1: 2.5, kl: 26, fold: 3.8}}
  tab_density_finiteB_over_fm_w1: [0.87, 1.09]
  independent_converged_viper_8seeds: {T0: {w1: 9.39e-4, kl: 1.09e-5, fold: 2.52e-4},
                                       T3: {w1: 1.523e-3, kl: 3.92e-5, fold: 3.46e-4}}
  aqcot_converged_viper_8seeds: {T0: {w1: 8.06e-4, kl: 1.80e-5, fold: 2.12e-4},
                                 T3: {w1: 1.423e-3, kl: 6.35e-5, fold: 4.71e-4}}
  aqcot_euler_w1_viper: {T0: {euler2: 1.79e-2, euler4: 7.27e-3}, T3: {euler2: 1.66e-2, euler4: 7.39e-3}}
  independent_euler_w1_viper: {T0: {euler2: 0.864, euler4: 0.203}, T3: {euler2: 0.752, euler4: 0.257}}
predictions:
  - id: P-C1
    registered: 2026-10-15
    status: graded
    verdict: "fail — T3 measured / predicted 0.90 (pass), T0 0.13 (fail); kill not fired (1.69 / 1.54 >= 1.5); graded 2026-10-15, lane Log"
    claim: the converged W1 ratio resynthesis / reassignment equals the coupler audit's raw / finiteB W1 ratio for the study's coupler, on each toy
    bands:
      measured_over_predicted_w1_ratio: "in [0.7, 1.3] on both toys (medians over 8 seeds each; the predicted ratio is the stamped audit JSON's ratio_raw_over_finiteB.w1_mean)"
    falsified_if: "resynthesis within 1.5x of reassignment on W1 (measured ratio < 1.5) on BOTH toys — then T1's reading of NFM-style couplings is wrong and the paper says so"
  - id: P-C1b
    registered: 2026-10-15
    status: graded
    verdict: "falsified — T0 resynth / raw 0.12 outside [0.6, 1.6] (reassign / finiteB 0.95); T3 0.98 / 1.09 pass; graded 2026-10-15"
    claim: the absolute levels are the audit's — the resynthesis flow's W1 is the raw-variant prediction, the reassignment flow's W1 the finiteB prediction (the metric-matched audit's E2-W1 band, replicated on raven for one coupler per toy)
    bands:
      resynth_w1_over_raw_prediction: "in [0.8, 1.25] on both toys"
      reassign_w1_over_finiteB_prediction: "in [0.8, 1.25] on both toys"
    falsified_if: "either ratio outside [0.6, 1.6] on either toy"
  - id: P-C2
    registered: 2026-10-15
    status: graded
    verdict: "falsified — T0 0.021 outside [0.25, 4]; T3 0.58 pass; graded 2026-10-15"
    claim: the converged KL ratio resynthesis / reassignment is the audit's raw / finiteB KL ratio within a factor 2 (KL is the fragile metric)
    bands:
      measured_over_predicted_kl_ratio: "in [0.5, 2.0] on both toys"
    falsified_if: "outside [0.25, 4] on either toy"
  - id: P-C3
    registered: 2026-10-15
    status: graded
    verdict: "descriptive — S: resynthesis straighter on both toys; Euler-2: resynthesis <= reassignment on T3 (0.0162 vs 0.0168), not on T0 (0.298 vs 0.018, seed-bimodal); graded 2026-10-15"
    claim: resynthesis is straighter and better at Euler-2 than reassignment (zero-variance targets per sample); reported, not a headline — the paper's claim is the converged floor
    bands:
      euler2_w1: "resynthesis <= reassignment on both toys (medians over seeds)"
      straightness_S: "resynthesis <= reassignment on both toys"
    falsified_if: "none (descriptive); the ordering is reported as measured"
  - id: P-D1
    registered: 2026-10-15
    status: graded
    verdict: "pass — Euler-4 W1 reflow1 / reassign 1.03 (T0), 1.08 (T3); graded 2026-10-15"
    claim: 1-Reflow matches AQCOT (reassign) at Euler-4 within 2x on W1 on both toys
    bands:
      euler4_w1_reflow1_over_reassign: "in [0.5, 2.0] on both toys"
    falsified_if: "> 2.0 on both toys (Reflow does not buy the few-NFE quality; then the 'why couple' sentence needs no Reflow caveat) — reported either way"
  - id: P-D2
    registered: 2026-10-15
    status: graded
    verdict: "falsified — W1 1.19 (p = 0.005) / 1.13 (p = 0.10), KL 1.005 / 0.93: both ratios < 1.2 on both toys; graded 2026-10-15"
    claim: 1-Reflow's converged W1 and KL are worse than independent's by >= 1.5x on both toys (error accumulation through the teacher; Liu et al. report a quality drop)
    bands:
      w1_ratio_reflow1_over_indep: ">= 1.5 on both toys, Mann-Whitney 8 v 8 one-sided p < 0.05"
      kl_ratio_reflow1_over_indep: ">= 1.5 on both toys"
    falsified_if: "both ratios < 1.2 on either toy (1-Reflow keeps the teacher's converged quality)"
  - id: P-D3
    registered: 2026-10-15
    status: graded
    verdict: "falsified — train-wall ratio 1.53 (T0, between falsifier and band), 0.68 (T3: the 96-epoch coupler pretrain exceeds teacher + generation); graded 2026-10-15"
    claim: the Reflow pipeline wall (teacher training + pair generation + student training) is >= 2x the AQCOT pipeline wall (coupler pretrain + one coupled training run) at equal flow budget
    bands:
      wall_ratio_reflow_over_aqcot: ">= 2.0 on both toys (training-only walls; the run-wall reading, which counts the evaluation battery twice on the Reflow side, is reported alongside)"
    falsified_if: "< 1.5 on either toy"
  - id: kill-D
    registered: 2026-10-15
    status: graded
    verdict: "FIRED — P-D1 pass and reflow1 within 1.2x of independent on W1 (1.19 / 1.13) and KL (1.005 / 0.93) on both toys; graded 2026-10-15"
    claim: the review plan's kill criterion for study D — fires if 1-Reflow matches AQCOT on few-NFE (P-D1 pass) AND reaches independent's converged quality (W1 and KL within 1.2x) on both toys; then the few-NFE argument is reframed to 'equal few-NFE at no second training and with the exact density kept' and the paper says so
    bands: {}
    falsified_if: "n/a (a kill criterion; its firing is the result)"
  - id: P-C2D
    registered: 2026-10-15
    status: graded
    verdict: "falsified — converged sliced-W1 resynthesis / nested sort 0.885 (10 seeds; falsifier < 1.2); nested sort not significantly worse (p = 0.27), preimage better at Euler-2 (p = 0.006); graded 2026-10-16, lane Log"
    claim: 2D (gauss-nd-rot D = 2) — the KR stage-wise preimage (kr_qot_resynth) converges worse than the KR nested sort (kr_qot) on sliced W1, as the 1D resynthesis does; no per-coupler audit exists in 2D, so the band is the 1D T3 scale
    bands:
      converged_sw1_resynth_over_kr: "in [1.5, 10] (medians over 10 seeds)"
    falsified_if: "< 1.2 (the stage-wise preimage is as good as the nested sort in 2D, contradicting the 1D reading) — optional cell, graded only if run"
